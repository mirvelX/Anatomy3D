<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy3D v10.6 - Juncturae Membri Superioris Liberi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; }
        .interactive-panel { pointer-events: auto; max-height: 100vh; overflow-y: auto; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); color: white; border-right: 1px solid rgba(255,255,255,0.1); border-left: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body class="text-white">

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="interactive-panel glass-panel w-80 p-6 flex flex-col gap-6 shadow-2xl shadow-black relative z-20">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Anatomy3D <span class="text-gray-400 text-sm">v10.6</span></h1>
                <p class="text-sm text-gray-300 italic mt-1">Juncturae Membri Superioris</p>
                <div class="w-full h-px bg-gray-700 mt-4"></div>
            </div>

            <div>
                <h2 class="text-lg font-semibold text-white mb-3">თავისუფალი კიდური</h2>
                <div class="flex flex-col gap-2">
                    
                    <button onclick="highlightJoint('humeri')" id="btn-humeri" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent hover:border-purple-500">
                        <div class="font-medium text-purple-300">მხრის სახსარი</div>
                        <div class="text-xs text-gray-400">Articulatio humeri</div>
                    </button>
                    
                    <button onclick="highlightJoint('cubiti')" id="btn-cubiti" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent hover:border-teal-500">
                        <div class="font-medium text-teal-300">იდაყვის სახსარი</div>
                        <div class="text-xs text-gray-400">Articulatio cubiti</div>
                    </button>
                    
                    <button onclick="highlightJoint('radioulnar')" id="btn-radioulnar" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent hover:border-blue-500">
                        <div class="font-medium text-blue-300">წინამხრის შეერთებები</div>
                        <div class="text-xs text-gray-400">Membrana interossea & Art. radioulnaris</div>
                    </button>
                    
                    <button onclick="highlightJoint('all')" id="btn-all" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent text-center mt-2 text-white">
                        <div class="font-medium">სრული ხედი (Arm)</div>
                    </button>
                </div>
            </div>

            <div id="elements-control" class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                <h2 class="text-md font-semibold text-gray-200 mb-3">ვიზუალიზაციის კონტროლი</h2>
                
                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-300">ძვლის გამჭვირვალობა</span>
                        <input type="range" id="bone-opacity" min="10" max="100" value="100" class="w-24 cursor-pointer accent-blue-500">
                    </div>

                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-300">სასახსრე ბაგე (Labrum)</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="labrum-toggle" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-gray-600 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-purple-500"></div>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="mt-auto pt-4 text-xs text-gray-500 border-t border-slate-700">
                Data Struct: v10.6 JSON parsed.<br>
                Source: კაციტაძე / კონსპექტი
            </div>
        </div>

        <div class="ml-auto p-6 pointer-events-none flex flex-col items-end w-96 relative z-20">
            <div id="info-panel" class="glass-panel p-5 rounded-xl transition-all duration-300 opacity-0 transform translate-x-8 pointer-events-auto shadow-lg shadow-black/50">
                <div class="flex items-start justify-between mb-2">
                    <h3 id="info-title-geo" class="text-xl font-bold text-white"></h3>
                    <span id="info-badge" class="px-2 py-1 text-xs font-bold rounded bg-slate-700 text-slate-300"></span>
                </div>
                <h4 id="info-title-lat" class="text-md text-blue-300 italic mb-3 font-serif"></h4>
                <div class="w-full h-px bg-slate-600 mb-3"></div>
                <p id="info-desc" class="text-sm text-gray-300 leading-relaxed"></p>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0f172a, 0.015);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 20);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0); 

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.7);
        mainLight.position.set(10, 15, 15);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xa5b4fc, 0.4);
        fillLight.position.set(-10, 5, -15);
        scene.add(fillLight);

        const materials = {
            bone: new THREE.MeshStandardMaterial({ 
                color: 0xeae6d8, roughness: 0.8, metalness: 0.1, transparent: true, opacity: 1 
            }),
            cartilage: new THREE.MeshStandardMaterial({
                color: 0xbce6eb, roughness: 0.4, transparent: true, opacity: 0.9
            }),
            capsuleHumeri: new THREE.MeshStandardMaterial({
                color: 0xc084fc, roughness: 0.6, transparent: true, opacity: 0.5, side: THREE.DoubleSide // Shoulder
            }),
            capsuleCubiti: new THREE.MeshStandardMaterial({
                color: 0x2dd4bf, roughness: 0.6, transparent: true, opacity: 0.5, side: THREE.DoubleSide // Elbow
            }),
            membrane: new THREE.MeshStandardMaterial({
                color: 0x60a5fa, roughness: 0.7, transparent: true, opacity: 0.6, side: THREE.DoubleSide // Interosseous
            }),
            labrum: new THREE.MeshStandardMaterial({
                color: 0xfab160, roughness: 0.5, transparent: true, opacity: 0.9 // Labrum glenoidale
            })
        };

        const armGroup = new THREE.Group();
        scene.add(armGroup);

        const meshes = {
            bones: [],
            humeriJoint: [],
            cubitiJoint: [],
            membrane: [],
            labrum: null
        };

        function createHumerus() {
            const humerusGroup = new THREE.Group();
            
            // Caput humeri (Head)
            const headGeo = new THREE.SphereGeometry(1.2, 32, 32, 0, Math.PI * 2, 0, Math.PI / 1.5);
            const head = new THREE.Mesh(headGeo, materials.bone);
            head.rotation.z = -Math.PI / 4;
            head.position.set(0.5, 4, 0);
            
            // Cartilage for head
            const headCartGeo = new THREE.SphereGeometry(1.22, 32, 32, 0, Math.PI * 2, 0, Math.PI / 1.6);
            const headCart = new THREE.Mesh(headCartGeo, materials.cartilage);
            head.add(headCart);
            
            humerusGroup.add(head);
            meshes.bones.push(head);

            // Corpus humeri (Shaft)
            const shaftGeo = new THREE.CylinderGeometry(0.6, 0.4, 7, 16);
            const shaft = new THREE.Mesh(shaftGeo, materials.bone);
            shaft.position.set(0, 0.5, 0);
            humerusGroup.add(shaft);
            meshes.bones.push(shaft);

            // Condylus humeri (Distal end: Trochlea & Capitulum)
            const distalGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.8, 16);
            const distal = new THREE.Mesh(distalGeo, materials.bone);
            distal.rotation.z = Math.PI / 2;
            distal.position.set(0, -3, 0);
            humerusGroup.add(distal);
            meshes.bones.push(distal);

            return humerusGroup;
        }

        function createScapulaFragment() {
            const scapulaGroup = new THREE.Group();
            
            // Cavitas glenoidalis
            const glenoidGeo = new THREE.CylinderGeometry(1.2, 1, 0.5, 32);
            glenoidGeo.scale(1, 1, 1.3);
            const glenoid = new THREE.Mesh(glenoidGeo, materials.bone);
            glenoid.rotation.z = Math.PI / 2;
            glenoid.position.set(1.8, 4, 0);
            
            // Cartilage
            const glenoidCart = new THREE.Mesh(glenoidGeo.clone().scale(1.05, 1.05, 1.05), materials.cartilage);
            glenoid.add(glenoidCart);
            
            scapulaGroup.add(glenoid);
            meshes.bones.push(glenoid);

            // Labrum glenoidale (fibrocartilaginous ring)
            const labrumGeo = new THREE.TorusGeometry(1.15, 0.15, 16, 32);
            labrumGeo.scale(1, 1, 1.3);
            const labrum = new THREE.Mesh(labrumGeo, materials.labrum);
            labrum.rotation.y = Math.PI / 2;
            labrum.position.set(1.5, 4, 0);
            scapulaGroup.add(labrum);
            meshes.labrum = labrum;
            
            // Scapula body fragment
            const bodyGeo = new THREE.BoxGeometry(2, 3, 0.5);
            const body = new THREE.Mesh(bodyGeo, materials.bone);
            body.position.set(3, 3, 0);
            scapulaGroup.add(body);
            meshes.bones.push(body);

            return scapulaGroup;
        }

        function createForearm() {
            const forearmGroup = new THREE.Group();
            forearmGroup.position.set(0, -3.5, 0);

            // Ulna (Medial/Pinky side - let's say X = -0.5)
            const ulnaShaftGeo = new THREE.CylinderGeometry(0.5, 0.3, 6, 16);
            const ulna = new THREE.Mesh(ulnaShaftGeo, materials.bone);
            ulna.position.set(-0.6, -3, 0);
            forearmGroup.add(ulna);
            meshes.bones.push(ulna);
            
            // Olecranon & Incisura trochlearis (Hook)
            const olecranonGeo = new THREE.SphereGeometry(0.6, 16, 16);
            const olecranon = new THREE.Mesh(olecranonGeo, materials.bone);
            olecranon.position.set(-0.6, 0.2, -0.2);
            forearmGroup.add(olecranon);
            meshes.bones.push(olecranon);

            // Radius (Lateral/Thumb side - let's say X = 0.6)
            const radiusShaftGeo = new THREE.CylinderGeometry(0.3, 0.6, 6, 16);
            const radius = new THREE.Mesh(radiusShaftGeo, materials.bone);
            radius.position.set(0.6, -3, 0);
            forearmGroup.add(radius);
            meshes.bones.push(radius);

            // Caput radii
            const radHeadGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 32);
            const radHead = new THREE.Mesh(radHeadGeo, materials.bone);
            radHead.position.set(0.6, 0.2, 0);
            forearmGroup.add(radHead);
            meshes.bones.push(radHead);
            
            const radHeadCart = new THREE.Mesh(radHeadGeo.clone().scale(1.05, 1.1, 1.05), materials.cartilage);
            radHead.add(radHeadCart);

            // Membrana interossea antebrachii
            const membraneGeo = new THREE.PlaneGeometry(1.2, 5.5);
            const membrane = new THREE.Mesh(membraneGeo, materials.membrane);
            membrane.position.set(0, -3, 0);
            forearmGroup.add(membrane);
            meshes.membrane.push(membrane);

            return forearmGroup;
        }

        armGroup.add(createHumerus());
        armGroup.add(createScapulaFragment());
        armGroup.add(createForearm());

        // 1. Articulatio Humeri (Capsule)
        const humeriCapsuleGeo = new THREE.SphereGeometry(1.6, 32, 16);
        const humeriCapsule = new THREE.Mesh(humeriCapsuleGeo, materials.capsuleHumeri);
        humeriCapsule.position.set(0.8, 4, 0);
        armGroup.add(humeriCapsule);
        meshes.humeriJoint.push(humeriCapsule);

        // 2. Articulatio Cubiti (Capsule enclosing all 3 joints)
        const cubitiCapsuleGeo = new THREE.CylinderGeometry(1.4, 1.2, 1.8, 16);
        const cubitiCapsule = new THREE.Mesh(cubitiCapsuleGeo, materials.capsuleCubiti);
        cubitiCapsule.position.set(0, -3.2, 0);
        armGroup.add(cubitiCapsule);
        meshes.cubitiJoint.push(cubitiCapsule);


        const anatomyData = {
            'humeri': {
                name_geo: 'მხრის სახსარი',
                name_lat: 'Articulatio humeri',
                type: 'Diarthrosis (Sphoeroidea)',
                desc: 'ტიპური სფერული და მრავალღერძიანი სახსარი. ბეჭის ზედაპირის სიმცირეს აკომპენსირებს სასახსრე ბაგე (Labrum glenoidale). გამოირჩევა დიდი მობილურობით და ფართო სასახსრე ჩანთით.'
            },
            'cubiti': {
                name_geo: 'იდაყვის სახსარი',
                name_lat: 'Articulatio cubiti',
                type: 'Diarthrosis (Composita)',
                desc: 'რთული სახსარია, აერთიანებს სამ სახსარს ერთ კაფსულაში: მხარ-იდაყვის (Art. humeroulnaris - ჭაღისებრი), მხარ-სხივის (Art. humeroradialis - სფერული) და პროქსიმალურ სხივ-იდაყვის (Art. radioulnaris proximalis - ცილინდრული).'
            },
            'radioulnar': {
                name_geo: 'წინამხრის შეერთებები',
                name_lat: 'Membrana interossea & Art. radioulnaris',
                type: 'Syndesmosis / Diarthrosis (Trochoidea)',
                desc: 'წინამხრის ძვლები უკავშირდებიან უწყვეტად (ძვალთაშუა აპკი) და წყვეტილად (პროქსიმალური და დისტალური სხივ-იდაყვის სახსრები). ისინი ერთად ქმნიან კომბინირებულ ცილინდრულ სახსარს, რაც უზრუნველყოფს სუპინაცია-პრონაციას.'
            },
            'all': {
                name_geo: 'თავისუფალი ზედა კიდური',
                name_lat: 'Membrum superius liberum',
                type: 'Generalis',
                desc: 'ზედა კიდურის ძირითადი შეერთებები, რომლებიც უზრუნველყოფენ ხელის ურთულეს და მაღალკოორდინირებულ მოძრაობებს.'
            }
        };

        const infoPanel = document.getElementById('info-panel');
        
        function updateInfo(key) {
            const data = anatomyData[key];
            if(!data) return;
            
            document.getElementById('info-title-geo').textContent = data.name_geo;
            document.getElementById('info-title-lat').textContent = data.name_lat;
            document.getElementById('info-badge').textContent = data.type;
            document.getElementById('info-desc').textContent = data.desc;
            
            infoPanel.classList.remove('opacity-0', 'translate-x-8');
            infoPanel.classList.add('opacity-100', 'translate-x-0');

            ['btn-humeri', 'btn-cubiti', 'btn-radioulnar', 'btn-all'].forEach(id => {
                document.getElementById(id).classList.remove('bg-slate-700', 'ring-2', 'ring-offset-2', 'ring-offset-slate-900');
            });
            
            if(key !== 'all') {
                document.getElementById(`btn-${key}`).classList.add('bg-slate-700', 'ring-2', 'ring-offset-2', 'ring-offset-slate-900');
            }
        }

        window.highlightJoint = function(type) {
            updateInfo(type);
            
            materials.bone.opacity = document.getElementById('bone-opacity').value / 100;
            materials.cartilage.opacity = 0.9;
            materials.capsuleHumeri.opacity = 0.15;
            materials.capsuleCubiti.opacity = 0.15;
            materials.membrane.opacity = 0.15;
            materials.labrum.opacity = document.getElementById('labrum-toggle').checked ? 0.9 : 0;

            if (type === 'humeri') {
                materials.capsuleHumeri.opacity = 0.8;
                materials.bone.opacity = 0.5;
                gsapCamera(1, 4, 8, 1, 4, 0); // Zoom to Shoulder
            } 
            else if (type === 'cubiti') {
                materials.capsuleCubiti.opacity = 0.8;
                materials.bone.opacity = 0.5;
                gsapCamera(0, -3, 7, 0, -3, 0); // Zoom to Elbow
            } 
            else if (type === 'radioulnar') {
                materials.membrane.opacity = 0.8;
                materials.bone.opacity = 0.6;
                gsapCamera(0, -5, 12, 0, -5, 0); // Focus on forearm
            }
            else {
                // All
                materials.bone.opacity = document.getElementById('bone-opacity').value / 100;
                materials.capsuleHumeri.opacity = 0.5;
                materials.capsuleCubiti.opacity = 0.5;
                materials.membrane.opacity = 0.6;
                gsapCamera(0, 0, 20, 0, 0, 0); // Default view
            }
        };

        function gsapCamera(cX, cY, cZ, tX, tY, tZ) {
            const camTarget = new THREE.Vector3(cX, cY, cZ);
            const lookTarget = new THREE.Vector3(tX, tY, tZ);
            const speed = 0.04;
            
            const anim = () => {
                camera.position.lerp(camTarget, speed);
                controls.target.lerp(lookTarget, speed);
                if (camera.position.distanceTo(camTarget) > 0.1) {
                    requestAnimationFrame(anim);
                }
            };
            anim();
        }

        document.getElementById('bone-opacity').addEventListener('input', (e) => {
            materials.bone.opacity = e.target.value / 100;
        });

        document.getElementById('labrum-toggle').addEventListener('change', (e) => {
            materials.labrum.visible = e.target.checked;
        });

        highlightJoint('all');

        function animate() {
            requestAnimationFrame(animate);
            // Very slight idle breathing for dynamic feel
            const time = Date.now() * 0.0005;
            armGroup.position.y = Math.sin(time) * 0.1;
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
