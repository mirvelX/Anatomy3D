<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy3D v10.8 - Juncturae Membri Inferioris Liberi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; }
        .interactive-panel { pointer-events: auto; max-height: 100vh; overflow-y: auto; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); color: white; border-right: 1px solid rgba(255,255,255,0.1); border-left: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    /* v10.9-lab-theme */
:root{color-scheme:dark}
body{background:#091321!important;color:#ebf3ff!important;font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important}
.glass-panel{background:rgba(16,30,46,.94)!important;border-color:#35566b!important;backdrop-filter:blur(12px)}
.interactive-panel{box-shadow:0 18px 55px #0008!important}
button{border-radius:10px!important}
button:hover{filter:brightness(1.08)}
#canvas-container{background:radial-gradient(circle at 50% 30%,#1a3850 0,#0d1c2c 45%,#091522 100%)}
.v109-home-link{position:fixed;right:14px;bottom:14px;z-index:60;padding:9px 12px;border:1px solid #68bcb9;border-radius:10px;background:#123b42e8;color:#d9fffb;text-decoration:none;font-size:.78rem;font-weight:700;box-shadow:0 8px 30px #0005}
.v109-home-link:hover{background:#1d5458}
</style>
</head>
<body class="text-white">

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="interactive-panel glass-panel w-80 p-6 flex flex-col gap-6 shadow-2xl shadow-black relative z-20">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Anatomy3D <span class="text-gray-400 text-sm">v10.8</span></h1>
                <p class="text-sm text-gray-300 italic mt-1">Juncturae Membri Inferioris</p>
                <div class="w-full h-px bg-gray-700 mt-4"></div>
            </div>

            <div>
                <h2 class="text-lg font-semibold text-white mb-3">თავისუფალი კიდური</h2>
                <div class="flex flex-col gap-2">
                    
                    <button onclick="highlightJoint('coxae')" id="btn-coxae" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent hover:border-purple-500">
                        <div class="font-medium text-purple-300">მენჯ-ბარძაყის სახსარი</div>
                        <div class="text-xs text-gray-400">Articulatio coxae</div>
                    </button>
                    
                    <button onclick="highlightJoint('genus')" id="btn-genus" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent hover:border-teal-500">
                        <div class="font-medium text-teal-300">მუხლის სახსარი</div>
                        <div class="text-xs text-gray-400">Articulatio genus</div>
                    </button>
                    
                    <button onclick="highlightJoint('tibiofibular')" id="btn-tibiofibular" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent hover:border-blue-500">
                        <div class="font-medium text-blue-300">წვივის შეერთებები</div>
                        <div class="text-xs text-gray-400">Syndesmosis tibiofibularis</div>
                    </button>
                    
                    <button onclick="highlightJoint('all')" id="btn-all" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent text-center mt-2 text-white">
                        <div class="font-medium">სრული ხედი (Leg)</div>
                    </button>
                </div>
            </div>

            <div id="elements-control" class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                <h2 class="text-md font-semibold text-gray-200 mb-3">ვიზუალიზაციის კონტროლი</h2>
                
                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-300">ძვლის გამჭვირვალობა</span>
                        <input type="range" id="bone-opacity" min="10" max="100" value="100" class="w-24 cursor-pointer accent-blue-500">
                    </div>

                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-300">შიგა ელემენტები (მენისკი/იოგები)</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="intra-toggle" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-gray-600 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-purple-500"></div>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="mt-auto pt-4 text-xs text-gray-500 border-t border-slate-700">
                Data Struct: v10.8 JSON parsed.<br>
                Source: კაციტაძე / კონსპექტი
            </div>
        </div>

        <div class="ml-auto p-6 pointer-events-none flex flex-col items-end w-96 relative z-20">
            <div id="info-panel" class="glass-panel p-5 rounded-xl transition-all duration-300 opacity-0 transform translate-x-8 pointer-events-auto shadow-lg shadow-black/50">
                <div class="flex items-start justify-between mb-2">
                    <h3 id="info-title-geo" class="text-xl font-bold text-white"></h3>
                    <span id="info-badge" class="px-2 py-1 text-xs font-bold rounded bg-slate-700 text-slate-300"></span>
                </div>
                <h4 id="info-title-lat" class="text-md text-blue-300 italic mb-3 font-serif"></h4>
                <div class="w-full h-px bg-slate-600 mb-3"></div>
                <p id="info-desc" class="text-sm text-gray-300 leading-relaxed"></p>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0f172a, 0.012);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 25);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, -3, 0); 

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.7);
        mainLight.position.set(10, 15, 15);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0xa5b4fc, 0.4);
        fillLight.position.set(-10, 5, -15);
        scene.add(fillLight);

        const materials = {
            bone: new THREE.MeshStandardMaterial({ 
                color: 0xeae6d8, roughness: 0.8, metalness: 0.1, transparent: true, opacity: 1 
            }),
            cartilage: new THREE.MeshStandardMaterial({
                color: 0xbce6eb, roughness: 0.4, transparent: true, opacity: 0.9
            }),
            capsuleCoxae: new THREE.MeshStandardMaterial({
                color: 0xc084fc, roughness: 0.6, transparent: true, opacity: 0.5, side: THREE.DoubleSide // Hip
            }),
            capsuleGenus: new THREE.MeshStandardMaterial({
                color: 0x2dd4bf, roughness: 0.6, transparent: true, opacity: 0.5, side: THREE.DoubleSide // Knee
            }),
            membrane: new THREE.MeshStandardMaterial({
                color: 0x60a5fa, roughness: 0.7, transparent: true, opacity: 0.6, side: THREE.DoubleSide // Interosseous
            }),
            intraArticular: new THREE.MeshStandardMaterial({
                color: 0xfab160, roughness: 0.5, transparent: true, opacity: 0.9 // Meniscus, Cruciate ligs, Labrum
            })
        };

        const legGroup = new THREE.Group();
        scene.add(legGroup);

        const meshes = {
            bones: [],
            coxaeJoint: [],
            genusJoint: [],
            membrane: [],
            intraElements: []
        };

        function createFemurAndHip() {
            const group = new THREE.Group();
            
            // Acetabulum (Pelvis fragment)
            const acetabulumGeo = new THREE.CylinderGeometry(1.6, 1.4, 1, 32);
            acetabulumGeo.scale(1, 1, 1.2);
            const acetabulum = new THREE.Mesh(acetabulumGeo, materials.bone);
            acetabulum.rotation.z = Math.PI / 2;
            acetabulum.rotation.x = -Math.PI / 8;
            acetabulum.position.set(2.5, 6, 0);
            group.add(acetabulum);
            meshes.bones.push(acetabulum);

            // Labrum acetabulare
            const labrumGeo = new THREE.TorusGeometry(1.5, 0.2, 16, 32);
            labrumGeo.scale(1, 1, 1.2);
            const labrum = new THREE.Mesh(labrumGeo, materials.intraArticular);
            labrum.rotation.copy(acetabulum.rotation);
            labrum.position.set(2.0, 6, 0);
            group.add(labrum);
            meshes.intraElements.push(labrum);

            // Caput femoris (Femoral Head)
            const headGeo = new THREE.SphereGeometry(1.3, 32, 32);
            const head = new THREE.Mesh(headGeo, materials.bone);
            head.position.set(1.5, 5.5, 0);
            
            const headCart = new THREE.Mesh(headGeo.clone().scale(1.02, 1.02, 1.02), materials.cartilage);
            head.add(headCart);
            group.add(head);
            meshes.bones.push(head);

            // Collum femoris (Neck)
            const neckGeo = new THREE.CylinderGeometry(0.6, 0.7, 2, 16);
            const neck = new THREE.Mesh(neckGeo, materials.bone);
            neck.rotation.z = -Math.PI / 3;
            neck.position.set(0.5, 4.5, 0);
            group.add(neck);
            meshes.bones.push(neck);

            // Trochanter major & minor (Greater/Lesser trochanters)
            const trochMajorGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const trochMajor = new THREE.Mesh(trochMajorGeo, materials.bone);
            trochMajor.position.set(-0.3, 4.8, 0);
            group.add(trochMajor);
            meshes.bones.push(trochMajor);

            // Corpus femoris (Shaft)
            const shaftGeo = new THREE.CylinderGeometry(0.7, 0.5, 8, 16);
            const shaft = new THREE.Mesh(shaftGeo, materials.bone);
            // Slight bow
            shaft.rotation.z = -0.05;
            shaft.position.set(-0.2, 0.5, 0);
            group.add(shaft);
            meshes.bones.push(shaft);

            // Condyli femoris (Distal condyles for knee)
            const condyleGeo = new THREE.SphereGeometry(1, 16, 16);
            condyleGeo.scale(1, 1.2, 1.5);
            
            const condyleL = new THREE.Mesh(condyleGeo, materials.bone);
            condyleL.position.set(-0.9, -3.5, 0);
            const condyleLCart = new THREE.Mesh(condyleGeo.clone().scale(1.05, 1.05, 1.05), materials.cartilage);
            condyleL.add(condyleLCart);
            
            const condyleR = new THREE.Mesh(condyleGeo, materials.bone);
            condyleR.position.set(0.9, -3.5, 0);
            const condyleRCart = new THREE.Mesh(condyleGeo.clone().scale(1.05, 1.05, 1.05), materials.cartilage);
            condyleR.add(condyleRCart);

            group.add(condyleL);
            group.add(condyleR);
            meshes.bones.push(condyleL, condyleR);

            return group;
        }

        function createTibiaFibulaAndKnee() {
            const group = new THREE.Group();
            group.position.set(0, -4.5, 0);

            // Menisci (Medial & Lateral)
            const meniscusGeo = new THREE.TorusGeometry(0.7, 0.2, 16, 32, Math.PI); // Half donut
            meniscusGeo.scale(1, 0.5, 1);
            
            const meniscusL = new THREE.Mesh(meniscusGeo, materials.intraArticular);
            meniscusL.rotation.x = -Math.PI / 2;
            meniscusL.position.set(-0.9, 0.2, 0);
            group.add(meniscusL);
            
            const meniscusR = new THREE.Mesh(meniscusGeo, materials.intraArticular);
            meniscusR.rotation.x = -Math.PI / 2;
            meniscusR.position.set(0.9, 0.2, 0);
            group.add(meniscusR);
            meshes.intraElements.push(meniscusL, meniscusR);

            // Cruciate Ligaments (ACL/PCL) - simplified crossed cylinders
            const cruciateGeo = new THREE.CylinderGeometry(0.15, 0.15, 1.5);
            const acl = new THREE.Mesh(cruciateGeo, materials.intraArticular);
            acl.rotation.x = Math.PI / 4;
            acl.rotation.z = Math.PI / 6;
            acl.position.set(0, 0.8, 0);
            
            const pcl = new THREE.Mesh(cruciateGeo, materials.intraArticular);
            pcl.rotation.x = -Math.PI / 4;
            pcl.rotation.z = -Math.PI / 6;
            pcl.position.set(0, 0.8, -0.2);
            
            group.add(acl);
            group.add(pcl);
            meshes.intraElements.push(acl, pcl);

            // Tibia Plateau
            const plateauGeo = new THREE.BoxGeometry(3, 0.8, 2);
            const plateau = new THREE.Mesh(plateauGeo, materials.bone);
            plateau.position.set(0, -0.2, 0);
            const plateauCart = new THREE.Mesh(plateauGeo.clone().scale(1.02, 1.05, 1.02), materials.cartilage);
            plateau.add(plateauCart);
            group.add(plateau);
            meshes.bones.push(plateau);

            // Tibia Shaft
            const tibiaShaftGeo = new THREE.CylinderGeometry(0.7, 0.5, 7, 16);
            const tibia = new THREE.Mesh(tibiaShaftGeo, materials.bone);
            tibia.position.set(0.2, -4, 0);
            group.add(tibia);
            meshes.bones.push(tibia);

            // Fibula Shaft
            const fibulaShaftGeo = new THREE.CylinderGeometry(0.3, 0.25, 6.5, 16);
            const fibula = new THREE.Mesh(fibulaShaftGeo, materials.bone);
            fibula.position.set(-1.2, -4.2, 0.5);
            group.add(fibula);
            meshes.bones.push(fibula);

            // Membrana interossea cruris
            const membraneGeo = new THREE.PlaneGeometry(1.2, 6);
            const membrane = new THREE.Mesh(membraneGeo, materials.membrane);
            membrane.position.set(-0.5, -4.2, 0.2);
            membrane.rotation.y = Math.PI / 8;
            group.add(membrane);
            meshes.membrane.push(membrane);

            return group;
        }

        legGroup.add(createFemurAndHip());
        legGroup.add(createTibiaFibulaAndKnee());

        // 1. Articulatio Coxae (Hip Capsule)
        const coxaeCapsuleGeo = new THREE.SphereGeometry(2, 32, 16);
        coxaeCapsuleGeo.scale(1.2, 1, 1);
        const coxaeCapsule = new THREE.Mesh(coxaeCapsuleGeo, materials.capsuleCoxae);
        coxaeCapsule.position.set(1.2, 5.5, 0);
        coxaeCapsule.rotation.z = -Math.PI / 6;
        legGroup.add(coxaeCapsule);
        meshes.coxaeJoint.push(coxaeCapsule);

        // 2. Articulatio Genus (Knee Capsule)
        const genusCapsuleGeo = new THREE.CylinderGeometry(1.8, 1.6, 2.5, 16);
        const genusCapsule = new THREE.Mesh(genusCapsuleGeo, materials.capsuleGenus);
        genusCapsule.position.set(0, -3.5, 0);
        legGroup.add(genusCapsule);
        meshes.genusJoint.push(genusCapsule);


        const anatomyData = {
            'coxae': {
                name_geo: 'მენჯ-ბარძაყის სახსარი',
                name_lat: 'Articulatio coxae',
                type: 'Diarthrosis (Cotylica)',
                desc: 'კაკლისებრი სახსარი, სფერულის ნაირსახეობა. ბეჭისგან განსხვავებით ფოსო ღრმაა და დამატებით ამოვსებულია სასახსრე ბაგით (Labrum acetabulare). გამოირჩევა ძალიან მძლავრი კაფსულითა და იოგებით (მაგ. Lig. iliofemorale).'
            },
            'genus': {
                name_geo: 'მუხლის სახსარი',
                name_lat: 'Articulatio genus',
                type: 'Diarthrosis (Bicondylaris)',
                desc: 'ყველაზე რთული და მასიური როკოვანი სახსარი. შეიცავს უმნიშვნელოვანეს შიგა-სასახსრე სტრუქტურებს: მედიალურ და ლატერალურ მენისკებს, აგრეთვე წინა და უკანა ჯვარედინა იოგებს (Ligg. cruciata).'
            },
            'tibiofibular': {
                name_geo: 'წვივის შეერთებები',
                name_lat: 'Syndesmosis tibiofibularis',
                type: 'Syndesmosis / Diarthrosis',
                desc: 'წვივისა და მცირე წვივის ძვლები უკავშირდებიან პროქსიმალურად ბრტყელი სახსრით (Art. tibiofibularis), ხოლო დისტალურად - მძლავრი სინდესმოზით და ძვალთაშუა აპკით (Membrana interossea cruris).'
            },
            'all': {
                name_geo: 'თავისუფალი ქვედა კიდური',
                name_lat: 'Membrum inferius liberum',
                type: 'Generalis',
                desc: 'ქვედა კიდურის ძირითადი სახსრები ადაპტირებულია საყრდენი და ლოკომოტორული ფუნქციისთვის, რის გამოც გამოირჩევიან მასიურობით, მძლავრი კაფსულებითა და შეზღუდული მობილურობით ზედა კიდურთან შედარებით.'
            }
        };

        const infoPanel = document.getElementById('info-panel');
        
        function updateInfo(key) {
            const data = anatomyData[key];
            if(!data) return;
            
            document.getElementById('info-title-geo').textContent = data.name_geo;
            document.getElementById('info-title-lat').textContent = data.name_lat;
            document.getElementById('info-badge').textContent = data.type;
            document.getElementById('info-desc').textContent = data.desc;
            
            infoPanel.classList.remove('opacity-0', 'translate-x-8');
            infoPanel.classList.add('opacity-100', 'translate-x-0');

            ['btn-coxae', 'btn-genus', 'btn-tibiofibular', 'btn-all'].forEach(id => {
                document.getElementById(id).classList.remove('bg-slate-700', 'ring-2', 'ring-offset-2', 'ring-offset-slate-900');
            });
            
            if(key !== 'all') {
                document.getElementById(`btn-${key}`).classList.add('bg-slate-700', 'ring-2', 'ring-offset-2', 'ring-offset-slate-900');
            }
        }

        window.highlightJoint = function(type) {
            updateInfo(type);
            
            materials.bone.opacity = document.getElementById('bone-opacity').value / 100;
            materials.cartilage.opacity = 0.9;
            materials.capsuleCoxae.opacity = 0.15;
            materials.capsuleGenus.opacity = 0.15;
            materials.membrane.opacity = 0.15;
            materials.intraArticular.opacity = document.getElementById('intra-toggle').checked ? 0.9 : 0;

            if (type === 'coxae') {
                materials.capsuleCoxae.opacity = 0.8;
                materials.bone.opacity = 0.5;
                gsapCamera(1.5, 5.5, 8, 1.5, 5.5, 0); // Zoom to Hip
            } 
            else if (type === 'genus') {
                materials.capsuleGenus.opacity = 0.8;
                materials.bone.opacity = 0.5;
                gsapCamera(0, -3.5, 8, 0, -3.5, 0); // Zoom to Knee
            } 
            else if (type === 'tibiofibular') {
                materials.membrane.opacity = 0.8;
                materials.bone.opacity = 0.6;
                gsapCamera(-1, -7, 12, 0, -7, 0); // Focus on lower leg membrane
            }
            else {
                // All
                materials.bone.opacity = document.getElementById('bone-opacity').value / 100;
                materials.capsuleCoxae.opacity = 0.5;
                materials.capsuleGenus.opacity = 0.5;
                materials.membrane.opacity = 0.6;
                gsapCamera(0, 2, 25, 0, -3, 0); // Default view
            }
        };

        function gsapCamera(cX, cY, cZ, tX, tY, tZ) {
            const camTarget = new THREE.Vector3(cX, cY, cZ);
            const lookTarget = new THREE.Vector3(tX, tY, tZ);
            const speed = 0.04;
            
            const anim = () => {
                camera.position.lerp(camTarget, speed);
                controls.target.lerp(lookTarget, speed);
                if (camera.position.distanceTo(camTarget) > 0.1) {
                    requestAnimationFrame(anim);
                }
            };
            anim();
        }

        document.getElementById('bone-opacity').addEventListener('input', (e) => {
            materials.bone.opacity = e.target.value / 100;
        });

        document.getElementById('intra-toggle').addEventListener('change', (e) => {
            materials.intraArticular.visible = e.target.checked;
        });

        highlightJoint('all');

        function animate() {
            requestAnimationFrame(animate);
            // Very slight idle breathing for dynamic feel
            const time = Date.now() * 0.0005;
            legGroup.position.y = Math.sin(time) * 0.1;
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
