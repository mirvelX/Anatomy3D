<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy3D v10.3 - Juncturae Columnae Vertebralis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; }
        .interactive-panel { pointer-events: auto; max-height: 100vh; overflow-y: auto; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); color: white; border-right: 1px solid rgba(255,255,255,0.1); border-left: 1px solid rgba(255,255,255,0.1); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    /* v10.9-lab-theme */
:root{color-scheme:dark}
body{background:#091321!important;color:#ebf3ff!important;font-family:system-ui,-apple-system,"Segoe UI",sans-serif!important}
.glass-panel{background:rgba(16,30,46,.94)!important;border-color:#35566b!important;backdrop-filter:blur(12px)}
.interactive-panel{box-shadow:0 18px 55px #0008!important}
button{border-radius:10px!important}
button:hover{filter:brightness(1.08)}
#canvas-container{background:radial-gradient(circle at 50% 30%,#1a3850 0,#0d1c2c 45%,#091522 100%)}
.v109-home-link{position:fixed;right:14px;bottom:14px;z-index:60;padding:9px 12px;border:1px solid #68bcb9;border-radius:10px;background:#123b42e8;color:#d9fffb;text-decoration:none;font-size:.78rem;font-weight:700;box-shadow:0 8px 30px #0005}
.v109-home-link:hover{background:#1d5458}
</style>
</head>
<body class="text-white">

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="interactive-panel glass-panel w-80 p-6 flex flex-col gap-6 shadow-2xl shadow-black relative z-20">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Anatomy3D <span class="text-gray-400 text-sm">v10.3</span></h1>
                <p class="text-sm text-gray-300 italic mt-1">Juncturae Columnae Vertebralis</p>
                <div class="w-full h-px bg-gray-700 mt-4"></div>
            </div>

            <!-- Joint Classifications in Vertebral Column -->
            <div>
                <h2 class="text-lg font-semibold text-white mb-3">ხერხემლის შეერთებები</h2>
                <div class="flex flex-col gap-2">
                    
                    <button onclick="highlightStructure('disc')" id="btn-disc" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent hover:border-orange-500">
                        <div class="font-medium text-orange-300">მალთაშუა დისკო</div>
                        <div class="text-xs text-gray-400">სიმფიზი (Symphysis)</div>
                    </button>
                    
                    <button onclick="highlightStructure('ligaments')" id="btn-ligaments" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent hover:border-blue-500">
                        <div class="font-medium text-blue-300">იოგოვანი აპარატი</div>
                        <div class="text-xs text-gray-400">სინდესმოზი (Syndesmosis)</div>
                    </button>
                    
                    <button onclick="highlightStructure('facet')" id="btn-facet" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent hover:border-green-500">
                        <div class="font-medium text-green-300">რკალთაშუა სახსრები</div>
                        <div class="text-xs text-gray-400">დიართროზი (Art. zygapophysiales)</div>
                    </button>
                    
                    <button onclick="highlightStructure('all')" id="btn-all" class="text-left px-3 py-2 bg-slate-800/80 hover:bg-slate-700 rounded transition border border-transparent text-center mt-2 text-white">
                        <div class="font-medium">სრული სტრუქტურა</div>
                    </button>
                </div>
            </div>

            <div id="elements-control" class="bg-slate-800/50 p-4 rounded-lg border border-slate-700">
                <h2 class="text-md font-semibold text-gray-200 mb-3">შრეების კონტროლი</h2>
                
                <div class="flex flex-col gap-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-300">მალის სხეული (ძვალი)</span>
                        <input type="range" id="bone-opacity" min="10" max="100" value="100" class="w-24 cursor-pointer accent-blue-500">
                    </div>

                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-300">ლაბისებრი ბირთვი</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="nucleus-toggle" class="sr-only peer" checked>
                            <div class="w-9 h-5 bg-gray-600 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-orange-500"></div>
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="mt-auto pt-4 text-xs text-gray-500 border-t border-slate-700">
                Data Struct: v10.3 JSON parsed.<br>
                Source: კაციტაძე / კონსპექტი
            </div>
        </div>

        <div class="ml-auto p-6 pointer-events-none flex flex-col items-end w-96 relative z-20">
            <div id="info-panel" class="glass-panel p-5 rounded-xl transition-all duration-300 opacity-0 transform translate-x-8 pointer-events-auto shadow-lg shadow-black/50">
                <div class="flex items-start justify-between mb-2">
                    <h3 id="info-title-geo" class="text-xl font-bold text-white"></h3>
                    <span id="info-badge" class="px-2 py-1 text-xs font-bold rounded bg-slate-700 text-slate-300"></span>
                </div>
                <h4 id="info-title-lat" class="text-md text-blue-300 italic mb-3 font-serif"></h4>
                <div class="w-full h-px bg-slate-600 mb-3"></div>
                <p id="info-desc" class="text-sm text-gray-300 leading-relaxed"></p>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0f172a, 0.02);
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 5, 12);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);

        // Lighting setup for clinical/anatomical look
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xffffff, 0.8);
        mainLight.position.set(10, 15, 10);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0x60a5fa, 0.6); // Blueish rim light
        rimLight.position.set(-10, -5, -10);
        scene.add(rimLight);

        const materials = {
            bone: new THREE.MeshStandardMaterial({ 
                color: 0xeae6d8, roughness: 0.8, metalness: 0.1, transparent: true, opacity: 1 
            }),
            anulus: new THREE.MeshStandardMaterial({ 
                color: 0x94a3b8, roughness: 0.9, transparent: true, opacity: 0.8 
            }), // Fibrous ring
            nucleus: new THREE.MeshStandardMaterial({ 
                color: 0xfab160, roughness: 0.2, transmission: 0.5, transparent: true, opacity: 0.9 
            }), // Gelatinous core
            ligament: new THREE.MeshStandardMaterial({ 
                color: 0xa5b4fc, roughness: 0.7, transparent: true, opacity: 0.85, side: THREE.DoubleSide
            }), // Ligaments
            capsule: new THREE.MeshStandardMaterial({
                color: 0x86efac, roughness: 0.6, transparent: true, opacity: 0.6
            }) // Facet joint capsule
        };

        const spineGroup = new THREE.Group();
        scene.add(spineGroup);

        // Objects tracking
        const meshes = {
            bones: [],
            discs: { anulus: [], nucleus: [] },
            ligaments: [],
            facets: []
        };

        function createVertebra(yPos) {
            const vertGroup = new THREE.Group();
            
            // Corpus vertebrae (Body)
            const bodyGeo = new THREE.CylinderGeometry(2, 2.2, 1.8, 32);
            // Squish the cylinder slightly to make it kidney-shaped (approximate)
            bodyGeo.scale(1, 1, 0.8);
            const body = new THREE.Mesh(bodyGeo, materials.bone);
            body.castShadow = true;
            body.receiveShadow = true;
            vertGroup.add(body);
            meshes.bones.push(body);

            // Arcus vertebrae (Arch & Spinous Process) - Simplified block
            const archGeo = new THREE.BoxGeometry(1.2, 1, 3);
            const arch = new THREE.Mesh(archGeo, materials.bone);
            arch.position.set(0, 0, -2.5);
            arch.castShadow = true;
            vertGroup.add(arch);
            meshes.bones.push(arch);
            
            // Processus transversus (Transverse processes)
            const transGeo = new THREE.CylinderGeometry(0.3, 0.2, 3);
            const transProc = new THREE.Mesh(transGeo, materials.bone);
            transProc.rotation.z = Math.PI / 2;
            transProc.position.set(0, 0, -1.5);
            vertGroup.add(transProc);
            meshes.bones.push(transProc);

            // Processus articularis (Articular processes for facet joints)
            const artGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.5);
            
            const artLeft = new THREE.Mesh(artGeo, materials.bone);
            artLeft.position.set(1.2, 0, -1.8);
            vertGroup.add(artLeft);
            meshes.bones.push(artLeft);

            const artRight = new THREE.Mesh(artGeo, materials.bone);
            artRight.position.set(-1.2, 0, -1.8);
            vertGroup.add(artRight);
            meshes.bones.push(artRight);

            vertGroup.position.y = yPos;
            return vertGroup;
        }

        function createIntervertebralDisc(yPos) {
            const discGroup = new THREE.Group();

            // Anulus fibrosus (Outer ring)
            const anulusGeo = new THREE.CylinderGeometry(2, 2, 0.6, 32, 1, true);
            anulusGeo.scale(1, 1, 0.8);
            const anulus = new THREE.Mesh(anulusGeo, materials.anulus);
            // Cap it to make it solid but hollow for nucleus
            const capGeo = new THREE.RingGeometry(1.2, 2, 32);
            capGeo.scale(1, 1, 0.8);
            const capTop = new THREE.Mesh(capGeo, materials.anulus);
            capTop.rotation.x = -Math.PI / 2;
            capTop.position.y = 0.3;
            const capBottom = capTop.clone();
            capBottom.rotation.x = Math.PI / 2;
            capBottom.position.y = -0.3;

            anulus.add(capTop);
            anulus.add(capBottom);
            discGroup.add(anulus);
            meshes.discs.anulus.push(anulus);

            // Nucleus pulposus (Inner core)
            const nucleusGeo = new THREE.SphereGeometry(1.1, 32, 16);
            nucleusGeo.scale(1, 0.25, 0.8);
            const nucleus = new THREE.Mesh(nucleusGeo, materials.nucleus);
            discGroup.add(nucleus);
            meshes.discs.nucleus.push(nucleus);

            discGroup.position.y = yPos;
            return discGroup;
        }

        const vert1 = createVertebra(1.5);
        const vert2 = createVertebra(-1.5);
        const disc = createIntervertebralDisc(0);
        
        spineGroup.add(vert1);
        spineGroup.add(vert2);
        spineGroup.add(disc);

        const antLigamentGeo = new THREE.PlaneGeometry(1.5, 4.5);
        const antLigament = new THREE.Mesh(antLigamentGeo, materials.ligament);
        antLigament.position.set(0, 0, 1.85); // Front of bodies
        spineGroup.add(antLigament);
        meshes.ligaments.push(antLigament);

        function createFacetCapsule(xOffset) {
            const capsuleGeo = new THREE.SphereGeometry(0.6, 16, 16);
            capsuleGeo.scale(1, 1.5, 1);
            const capsule = new THREE.Mesh(capsuleGeo, materials.capsule);
            capsule.position.set(xOffset, 0, -1.8);
            spineGroup.add(capsule);
            meshes.facets.push(capsule);
        }
        createFacetCapsule(1.2);
        createFacetCapsule(-1.2);

        // Tilt the whole spine slightly to mimic natural lordosis/kyphosis curve
        spineGroup.rotation.x = 0.1;

        const anatomyData = {
            'disc': {
                name_geo: 'მალთაშუა დისკო (სიმფიზი)',
                name_lat: 'Discus intervertebralis',
                type: 'Symphysis',
                desc: 'შედგება პერიფერიული ფიბროზული რგოლისა (Anulus fibrosus) და ცენტრალური ლაბისებრი ბირთვისაგან (Nucleus pulposus). წარმოადგენს მალის სხეულებს შორის ამორტიზატორს.'
            },
            'ligaments': {
                name_geo: 'იოგოვანი აპარატი',
                name_lat: 'Syndesmosis columnae vertebralis',
                type: 'Syndesmosis',
                desc: 'მოიცავს წინა და უკანა გასწვრივ იოგებს (Lig. longitudinale anterius/posterius), ყვითელ იოგებს (Lig. flava), წვეტიანთაშუა და განივთაშუა იოგებს.'
            },
            'facet': {
                name_geo: 'რკალთაშუა (ფასეტური) სახსარი',
                name_lat: 'Articulatio zygapophysialis',
                type: 'Diarthrosis (Plana)',
                desc: 'ზედა და ქვედა სასახსრე მორჩებს შორის არსებული ბრტყელი სახსარი. გააჩნია სასახსრე ჩანთა, იძლევა ხერხემლის მოქნილობისა და ბრუნვის საშუალებას.'
            },
            'all': {
                name_geo: 'ხერხემლის სეგმენტი',
                name_lat: 'Segmentum vertebrale',
                type: 'Generalis',
                desc: 'აერთიანებს სამივე ტიპის კავშირს: სინდესმოზს, სიმფიზს და დიართროზს, რაც უზრუნველყოფს ხერხემლის მდგრადობასა და მოძრაობას.'
            }
        };

        const infoPanel = document.getElementById('info-panel');
        
        function updateInfo(key) {
            const data = anatomyData[key];
            if(!data) return;
            
            document.getElementById('info-title-geo').textContent = data.name_geo;
            document.getElementById('info-title-lat').textContent = data.name_lat;
            document.getElementById('info-badge').textContent = data.type;
            document.getElementById('info-desc').textContent = data.desc;
            
            infoPanel.classList.remove('opacity-0', 'translate-x-8');
            infoPanel.classList.add('opacity-100', 'translate-x-0');

            // Reset button styles
            ['btn-disc', 'btn-ligaments', 'btn-facet', 'btn-all'].forEach(id => {
                document.getElementById(id).classList.remove('bg-slate-700', 'ring-2', 'ring-offset-2', 'ring-offset-slate-900');
            });
            
            // Add active style to selected
            if(key !== 'all') {
                document.getElementById(`btn-${key}`).classList.add('bg-slate-700', 'ring-2', 'ring-offset-2', 'ring-offset-slate-900');
            }
        }

        window.highlightStructure = function(type) {
            updateInfo(type);
            
            // Reset opacity and colors
            materials.bone.opacity = document.getElementById('bone-opacity').value / 100;
            materials.anulus.opacity = 0.8;
            materials.anulus.color.setHex(0x94a3b8);
            materials.nucleus.opacity = 0.9;
            materials.ligament.opacity = 0.85;
            materials.capsule.opacity = 0.6;
            materials.capsule.color.setHex(0x86efac);

            // Logic for focusing structures
            if (type === 'disc') {
                materials.bone.opacity = 0.2;
                materials.ligament.opacity = 0.1;
                materials.capsule.opacity = 0.1;
                materials.anulus.color.setHex(0xffffff); // Highlight
                // Move camera slightly
                gsapCamera(10, 2, 10);
            } 
            else if (type === 'ligaments') {
                materials.bone.opacity = 0.4;
                materials.anulus.opacity = 0.1;
                materials.nucleus.opacity = 0.1;
                materials.capsule.opacity = 0.1;
                materials.ligament.opacity = 1;
                materials.ligament.color.setHex(0x818cf8); // Blue highlight
                gsapCamera(8, 2, 12);
            } 
            else if (type === 'facet') {
                materials.bone.opacity = 0.3;
                materials.anulus.opacity = 0.1;
                materials.nucleus.opacity = 0.1;
                materials.ligament.opacity = 0.1;
                materials.capsule.opacity = 0.9;
                materials.capsule.color.setHex(0x4ade80); // Green highlight
                gsapCamera(-8, 3, -10); // Look from back
            }
            else {
                // All
                materials.bone.opacity = document.getElementById('bone-opacity').value / 100;
                gsapCamera(12, 5, 12);
            }
        };

        // Simple smooth camera movement helper
        function gsapCamera(x, y, z) {
            const target = new THREE.Vector3(x, y, z);
            const speed = 0.05;
            
            const anim = () => {
                camera.position.lerp(target, speed);
                if (camera.position.distanceTo(target) > 0.1) {
                    requestAnimationFrame(anim);
                }
            };
            anim();
        }

        document.getElementById('bone-opacity').addEventListener('input', (e) => {
            materials.bone.opacity = e.target.value / 100;
        });

        document.getElementById('nucleus-toggle').addEventListener('change', (e) => {
            materials.nucleus.visible = e.target.checked;
        });

        // Initialize default view
        highlightStructure('all');
        updateInfo('all');

        function animate() {
            requestAnimationFrame(animate);
            
            // Add slow rotation to the nucleus to make it feel gelatinous/active
            meshes.discs.nucleus.forEach(n => {
                n.rotation.y += 0.005;
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
